<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボアソルチ出欠確認 (Admin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin specific highlight */
        .header {
            background-color: #333;
        }

        .app-title::after {
            content: ' - ADMIN';
            font-size: 0.8em;
            opacity: 0.7;
        }
    </style>
    <script>
        // Authentication check on load
        async function authenticate() {
            if (sessionStorage.getItem('isAdmin') === 'true') {
                document.body.classList.add('authenticated');
                return;
            }

            const password = prompt('管理者パスワードを入力してください:');
            if (!password) {
                window.location.href = '../index.html';
                return;
            }

            try {
                // Use the backend API to verify
                const response = await fetch('https://script.google.com/macros/s/AKfycbwsrZ0sCGt7-clLZpWjNqO29_G28WyVOnzun3mvEsIGB-TOOJLoE4zoYWTlMrkag0gbhQ/exec', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'verify_admin', password: password })
                });
                // Note: The actual implementation in app.js will handle the API call.
                // For simplicity during the initial check, we'll try to use a local function or let app.js handle it.
                // However, since app.js is loaded at the bottom, we might need a small inline check or wait.

                // Redefining the check to be handled after app.js loads or using a generic approach.
                // Let's modify app.js to handle this instead and just hide the body initially.
            } catch (e) {
                console.error(e);
            }
        }
    </script>
    <style>
        body:not(.authenticated) {
            display: none;
        }

        .authenticated {
            display: block !important;
        }
    </style>
</head>

<body>
    <header class="header">

                    <h3>リーグ名登録</h3>

                                style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd;">
                            <button id="add-league-btn" class="btn btn-primary"

                            <input type="time" id="new-match-kickoff" style="flex: 1;">

                        <div

                            <label><input type="radio" name="new-match-location" value="home" checked> ホーム</label>

                <div class="control-group">

                                <option value="">-- 試合を選択 --</option>
                            </select>
                            <button id="edit-match-btn-admin" class="btn"

                            <button id="delete-member-btn-admin" class="btn"
                                style="background: #ffebee; color: #d32f2f;">削除</button>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <h3>パスワード変更</h3>
                    <div

                        <input type="password" id="admin-old-password" placeholder="現在のパスワード"

                </div>
            </div>
        </section>

    </main>

    <!-- Edit Member Modal -->

            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">

                <button id="save-edit-member" class="btn btn-primary">保存</button>
            </div>
        </div>
